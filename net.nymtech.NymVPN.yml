id: net.nymtech.NymVPN
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
command: nym-vpn

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=ipc
  - --filesystem=/run/nym-vpn.sock:ro
  - --filesystem=/var/log/nym-vpnd:ro

modules:
  - shared-modules/libayatana-appindicator/libayatana-appindicator-gtk3.json
  - name: nym-vpn
    buildsystem: simple
    sources:
      - type: file
        url: https://github.com/nymtech/nym-vpn-client/releases/download/nym-vpn-v2026.16.0/nym-vpn_2026.16.0_linux_x64
        sha256: b2004be5a19da97fed24c65ef8cdad025c6c4bdad6d9f734bff581af5c13ff1d
        only-arches: [x86_64]
        dest-filename: nym-vpn
      - type: file
        url: https://raw.githubusercontent.com/nymtech/nym-vpn-client/5fcfdfdf4ee6110c44fb6c87dcd8995a6ba19d5d/nym-vpn-app/.pkg/flatpak/net.nymtech.NymVPN.metainfo.xml
        sha256: 05f906fe69d57eb78730cfa9df7acd7e753bc446ddac6de09276c74117990fdc
      - type: file
        url: https://raw.githubusercontent.com/nymtech/nym-vpn-client/5fcfdfdf4ee6110c44fb6c87dcd8995a6ba19d5d/nym-vpn-app/.pkg/app.desktop
        sha256: 143fd3eb05ccc8d714cda55c83221ffe6c5f83d85d5cce8407c188a8e72952d8
      - type: file
        url: https://raw.githubusercontent.com/nymtech/nym-vpn-client/5fcfdfdf4ee6110c44fb6c87dcd8995a6ba19d5d/nym-vpn-app/.pkg/icon.svg
        sha256: 8058039c52c588e38285971c4c37d50fdb8e05e50bbc19d7ffeb89d662a21f1e
    build-commands:
      - install -Dm755 nym-vpn /app/bin/nym-vpn
      - desktop-file-edit --set-key=Exec --set-value="env RUST_LOG=info,nym_vpn_app=debug nym-vpn %U" app.desktop
      - desktop-file-edit --set-icon=net.nymtech.NymVPN app.desktop
      - install -Dm644 app.desktop /app/share/applications/net.nymtech.NymVPN.desktop
      - install -Dm644 icon.svg /app/share/icons/hicolor/scalable/apps/net.nymtech.NymVPN.svg
      - install -Dm644 net.nymtech.NymVPN.metainfo.xml /app/share/metainfo/net.nymtech.NymVPN.metainfo.xml

