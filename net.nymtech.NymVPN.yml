id: net.nymtech.NymVPN
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
command: nym-vpn

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=ipc
  - --filesystem=/run/nym-vpn.sock:ro
  - --filesystem=/var/log/nym-vpnd:ro

modules:
  - shared-modules/libayatana-appindicator/libayatana-appindicator-gtk3.json
  - name: nym-vpn
    buildsystem: simple
    sources:
      - type: file
        url: https://github.com/nymtech/nym-vpn-client/releases/download/nym-vpn-v2026.12.4/nym-vpn_2026.12.4_linux_x64
        sha256: c7398d2b1ef9206ede1174374dd9d36632641a32650e8c2aef91598369be5b7c
        only-arches: [x86_64]
        dest-filename: nym-vpn
      - type: file
        url: https://raw.githubusercontent.com/nymtech/nym-vpn-client/a2dd2cd/nym-vpn-app/.pkg/flatpak/net.nymtech.NymVPN.metainfo.xml
        sha256: edbd35f52fd4aaf09c3a6069aa469759c030f4c4c496d212de7e51c7a7c20bba
      - type: file
        url: https://raw.githubusercontent.com/nymtech/nym-vpn-client/develop/nym-vpn-app/.pkg/app.desktop
        sha256: 89d01a49dac087c987b2741dddb3bcb9e7f1461d9c0f50b7f75044ed45db575e
      - type: file
        url: https://raw.githubusercontent.com/nymtech/nym-vpn-client/develop/nym-vpn-app/.pkg/icon.svg
        sha256: 8058039c52c588e38285971c4c37d50fdb8e05e50bbc19d7ffeb89d662a21f1e
    build-commands:
      - install -Dm755 nym-vpn /app/bin/nym-vpn
      - desktop-file-edit --set-key=Exec --set-value="env RUST_LOG=info,nym_vpn_app=debug nym-vpn %U" app.desktop
      - desktop-file-edit --set-icon=net.nymtech.NymVPN app.desktop
      - install -Dm644 app.desktop /app/share/applications/net.nymtech.NymVPN.desktop
      - install -Dm644 icon.svg /app/share/icons/hicolor/scalable/apps/net.nymtech.NymVPN.svg
      - install -Dm644 net.nymtech.NymVPN.metainfo.xml /app/share/metainfo/net.nymtech.NymVPN.metainfo.xml

